name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Where the docs and /r/*.json will be served. Set the repository variable
  # SITE_URL once hosting is decided; until then this defaults to the GitHub
  # Pages project URL (https://OWNER.github.io/REPO).
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (vitest + axe, contrast, every docs page)
        run: npm test

      - name: Build registry (shadcn build → public/r)
        run: npm run registry:build

      - name: Validate registry.json schema (shadcn)
        run: npx shadcn registry validate

      - name: Validate registry consistency and built output
        run: npm run registry:validate

      - name: Build docs
        run: npm run docs:build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  consumer-smoke:
    name: Install into a fresh Vite app with the shadcn CLI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Consumer smoke test
        # Builds for http://127.0.0.1:4175, serves it, and installs every item.
        run: npm run smoke:consumer -- "${{ runner.temp }}/smoke"
        env:
          SITE_URL: ""

  deploy:
    name: Deploy to GitHub Pages
    # Disabled until the repository exists and Pages is enabled: set the
    # repository variable DEPLOY_PAGES=true (Settings → Secrets and variables →
    # Actions → Variables) and choose "GitHub Actions" as the Pages source.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
    needs: [build, consumer-smoke]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
